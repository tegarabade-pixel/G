      - name: Seed reproducible Local Agent model + attach tools
        shell: bash
        run: |
          set -euo pipefail

          for i in {1..180}; do
            curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1 && break
            sleep 2
          done

          LOGIN_JSON="$(jq -cn \
            --arg email 'admin@local.ai' \
            --arg password "$LOCAL_AI_PASSWORD" \
            '{email:$email,password:$password}')"

          AUTH="$(curl -fsS --max-time 30 \
            -H 'Content-Type: application/json' \
            -d "$LOGIN_JSON" \
            http://127.0.0.1:8080/api/v1/auths/signin)"
          OWUI_TOKEN="$(echo "$AUTH" | jq -r '.token // empty')"
          if [ -z "$OWUI_TOKEN" ]; then
            echo "$AUTH" | jq . || true
            echo "::error::Gagal memperoleh admin token Open WebUI."
            exit 1
          fi
          echo "::add-mask::$OWUI_TOKEN"
          echo "OWUI_TOKEN=$OWUI_TOKEN" >> "$GITHUB_ENV"

          if [ "${{ inputs.web }}" = "on" ]; then
            WEB_CAP=true
            FEATURES='["web_search"]'
          else
            WEB_CAP=false
            FEATURES='[]'
          fi

          SYSTEM_PROMPT='You are the manager agent for a local multi-worker AI system. Understand the user goal semantically; never require trigger words. Answer directly when tools are unnecessary. When chat attachments are relevant, inspect them on demand with the built-in file tools instead of assuming their contents. Use web search only when freshness, verification, or explicit browsing is useful; fetch a page before making specific claims from it. Delegate to the coder specialist only when software-engineering expertise materially helps, and pass it only concise relevant context. After every tool result, decide whether another tool is actually needed or whether you can answer. Never invent tool results or claim an action happened unless a tool result proves it.'

          MODEL_DEF="$(jq -cn \
            --argjson webcap "$WEB_CAP" \
            --argjson features "$FEATURES" \
            --arg system "$SYSTEM_PROMPT" \
            '{
              id:"local-agent",
              base_model_id:"local-agent-base",
              name:"Local Agent",
              meta:{
                capabilities:{
                  vision:true,
                  file_context:false,
                  file_upload:true,
                  web_search:$webcap,
                  citations:false,
                  builtin_tools:true,
                  code_interpreter:false,
                  image_generation:false,
                  memory:false,
                  terminal:false
                },
                defaultFeatureIds:$features,
                builtinTools:{
                  time:false,
                  user_input:false,
                  files:true,
                  knowledge:false,
                  chats:false,
                  subagents:false,
                  memory:false,
                  web_search:$webcap,
                  image_generation:false,
                  code_interpreter:false,
                  notes:false,
                  channels:false,
                  tasks:false,
                  automations:false,
                  calendar:false,
                  notifications:false
                },
                toolIds:["server:coder"]
              },
              params:{
                function_calling:"native",
                temperature:0.25,
                system:$system
              },
              access_grants:[],
              is_active:true
            }'
          )"

          IMPORT_BODY="$(jq -cn --argjson model "$MODEL_DEF" '{models:[$model]}')"
          curl -fsS --max-time 30 -X POST \
            -H "Authorization: Bearer $OWUI_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$IMPORT_BODY" \
            http://127.0.0.1:8080/api/v1/models/import >/dev/null

          # Confirm both the model record and the external tool are visible to the admin.
          MODEL_CHECK="$(curl -fsS \
            -H "Authorization: Bearer $OWUI_TOKEN" \
            'http://127.0.0.1:8080/api/v1/models/model?id=local-agent')"
          TOOL_CHECK="$(curl -fsS \
            -H "Authorization: Bearer $OWUI_TOKEN" \
            http://127.0.0.1:8080/api/v1/tools/)"

          echo "$MODEL_CHECK" | jq '{id,base_model_id,meta:{capabilities:.meta.capabilities,builtinTools:.meta.builtinTools,toolIds:.meta.toolIds}}'

          if ! echo "$TOOL_CHECK" | jq -e '.[] | select(.id == "server:coder")' >/dev/null; then
            echo "$TOOL_CHECK" | jq 'map({id,name})' || true
            echo "::error::Open WebUI tidak menemukan external tool server:coder."
            exit 1
          fi

          echo "Local Agent seeded: Native tools + agentic files + coder specialist."

      - name: Native agent-loop preflight (coder delegation)
        shell: bash
        run: |
          set -euo pipefail

          USER_ID="$(cat /proc/sys/kernel/random/uuid)"
          ASSISTANT_ID="$(cat /proc/sys/kernel/random/uuid)"
          SESSION_ID="api-$(cat /proc/sys/kernel/random/uuid)"
          TS="$(date +%s)"
          PROMPT='Use the coder specialist because this is a programming-specialist check. Ask it to return exactly CODE_OK, then return CODE_OK to me.'

          CHAT_BODY="$(jq -cn \
            --arg uid "$USER_ID" \
            --arg aid "$ASSISTANT_ID" \
            --arg prompt "$PROMPT" \
            --argjson ts "$TS" \
            '{chat:{
              title:"Agentic preflight",
              models:["local-agent"],
              history:{
                currentId:$aid,
                messages:{
                  ($uid):{id:$uid,role:"user",content:$prompt,timestamp:$ts,models:["local-agent"],childrenIds:[$aid]},
                  ($aid):{id:$aid,role:"assistant",content:"",parentId:$uid,childrenIds:[],model:"local-agent",modelName:"Local Agent",modelIdx:0,done:false,timestamp:($ts+1)}
                }
              }
            }}'
          )"

          CHAT_ID="$(curl -fsS -X POST \
            -H "Authorization: Bearer $OWUI_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$CHAT_BODY" \
            http://127.0.0.1:8080/api/v1/chats/new | jq -r '.id')"

          START_BODY="$(jq -cn \
            --arg chat "$CHAT_ID" \
            --arg aid "$ASSISTANT_ID" \
            --arg sid "$SESSION_ID" \
            --arg prompt "$PROMPT" \
            '{
              model:"local-agent",
              messages:[{role:"user",content:$prompt}],
              stream:true,
              chat_id:$chat,
              id:$aid,
              session_id:$sid,
              features:{web_search:false,code_interpreter:false,image_generation:false,memory:false},
              background_tasks:{title_generation:false,tags_generation:false,follow_up_generation:false}
            }'
          )"

          START="$(date +%s)"
          curl -fsS -X POST \
            -H "Authorization: Bearer $OWUI_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$START_BODY" \
            http://127.0.0.1:8080/api/chat/completions >/dev/null

          for i in {1..180}; do
            N="$(curl -fsS \
              -H "Authorization: Bearer $OWUI_TOKEN" \
              "http://127.0.0.1:8080/api/tasks/chat/$CHAT_ID" | jq '.task_ids | length')"
            [ "$N" -eq 0 ] && break
            sleep 2
          done

          FINAL="$(curl -fsS \
            -H "Authorization: Bearer $OWUI_TOKEN" \
            "http://127.0.0.1:8080/api/v1/chats/$CHAT_ID")"
          END="$(date +%s)"
          CONTENT="$(echo "$FINAL" | jq -r --arg aid "$ASSISTANT_ID" '.chat.history.messages[$aid].content // empty')"
          OUTPUT="$(echo "$FINAL" | jq -c --arg aid "$ASSISTANT_ID" '.chat.history.messages[$aid].output // []')"

          echo "Agentic preflight answer: $(echo "$CONTENT" | head -c 180)"
          if echo "$OUTPUT" | grep -q 'delegate_to_coder'; then
            AGENT_STATUS="PASS: model selected coder tool"
          elif echo "$CONTENT" | grep -q 'CODE_OK'; then
            AGENT_STATUS="WARN: answer OK but tool-call record not detected"
            echo "::warning::Agent responded, but delegate_to_coder was not visible in the stored output."
          else
            AGENT_STATUS="WARN: tool selection needs tuning"
            echo "::warning::Native tool preflight did not clearly succeed; UI remains usable for manual testing."
          fi

          curl -fsS -X DELETE \
            -H "Authorization: Bearer $OWUI_TOKEN" \
            "http://127.0.0.1:8080/api/v1/chats/$CHAT_ID" >/dev/null || true

          {
            echo
            echo "## 🤖 Native agent loop"
            echo
            echo "- Result: **$AGENT_STATUS**"
            echo "- End-to-end preflight: **$((END - START))s**"
            echo "- Manager chooses tools semantically; no keyword router"
            echo "- File Context: **OFF**; Files tools: **ON when attachments exist**"
            echo "- Coder tool: **attached by default**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify WebUI + internet + public endpoint
        shell: bash
        run: |
          set -euo pipefail

          for i in {1..180}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          if ! curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then
            docker logs --tail 300 open-webui || true
            echo "::error::Open WebUI local gagal start."
            exit 1
          fi

          docker exec open-webui python - <<'PY'
          import urllib.request
          req = urllib.request.Request(
              "https://duckduckgo.com/?q=open+webui",
              headers={"User-Agent":"Mozilla/5.0"}
          )
          with urllib.request.urlopen(req, timeout=20) as r:
              print("Outbound internet HTTP:", r.status)
          PY

          READY=0
          for i in {1..120}; do
            if [ "${{ inputs.tunnel }}" = "ngrok-stable" ]; then
              if curl -fsS --max-time 10 \
                -H 'ngrok-skip-browser-warning: 1' \
                "$PUBLIC_URL/" >/dev/null 2>&1; then
                READY=1
                break
              fi
            else
              if curl -fsS --max-time 10 "$PUBLIC_URL/" >/dev/null 2>&1; then
                READY=1
                break
              fi
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "::error::Public WebUI belum dapat dijangkau."
            exit 1
          fi

          echo "Open WebUI public: READY"

      - name: Final agentic cluster summary
        shell: bash
        run: |
          set -euo pipefail

          {
            echo
            echo "## ✅ Local AI Agentic Cluster v2.1.1 READY"
            echo
            echo "- WebUI: **$PUBLIC_URL**"
            echo "- Login: \`admin@local.ai\`"
            echo "- Password: secret \`LOCAL_AI_PASSWORD\`"
            echo "- Visible model: **Local Agent (local-agent)**"
            echo "- Manager worker: \`${{ inputs.general_model }}\` / context **${{ inputs.general_context }}**"
            echo "- Coder specialist: \`${{ inputs.coder_model }}\` / context **${{ inputs.coder_context }}**"
            echo "- Thinking default: **${{ inputs.thinking }}**"
            echo "- Native Web Search: **${{ inputs.web }}**"
            echo
            echo "### Agent behavior"
            echo "- No keyword/regex routing for normal decisions"
            echo "- Manager model decides whether to answer directly, inspect chat files, browse the web, or delegate to coder"
            echo "- File Context is OFF; file retrieval is on-demand via list/query/grep/view tools"
            echo "- Coder is one small OpenAPI tool schema, not a second model stuffed into every prompt"
            echo "- Native function calling only; Legacy mode is not used"
            echo
            echo "### Isolation / performance"
            echo "- 3 GitHub jobs / 3 fresh VMs"
            echo "- General and coder models download in parallel"
            echo "- General model gets a dedicated inference VM"
            echo "- Coder is invoked only when the manager chooses it"
            echo "- Ollama remains localhost-only on both workers"
            echo "- Worker APIs are Tailscale-only + per-run bearer token"
            echo "- Router and worker gateways log request bytes, TTFT, and total latency"
            echo "- Only Open WebUI is publicly tunneled"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "======================================================"
          echo " LOCAL AI AGENTIC CLUSTER READY"
          echo " $PUBLIC_URL"
          echo " Model shown in UI: Local Agent"
          echo "======================================================"

      - name: Keep frontend alive
        shell: bash
        run: |
          set -euo pipefail

          WARN_G=0
          WARN_C=0

          while true; do
            if ! docker ps --format '{{.Names}}' | grep -qx open-webui; then
              echo "::error::Open WebUI stopped."
              docker logs --tail 300 open-webui || true
              exit 1
            fi

            if ! kill -0 "$(cat "$BASE/router.pid")" 2>/dev/null; then
              echo "::error::Manager gateway stopped."
              tail -200 "$BASE/logs/router.log" || true
              exit 1
            fi

            if ! kill -0 "$(cat "$BASE/coder-tool.pid")" 2>/dev/null; then
              echo "::error::Coder OpenAPI tool stopped."
              tail -200 "$BASE/logs/coder-tool.log" || true
              exit 1
            fi

            if curl -fsS --max-time 3 \
              -H "Authorization: Bearer $CLUSTER_KEY" \
              "http://${GENERAL_IP}:9001/health" >/dev/null 2>&1; then
              WARN_G=0
            else
              WARN_G=$((WARN_G + 1))
              [ "$WARN_G" -ne 1 ] || echo "::warning::General worker temporarily unavailable; manager will report the worker unavailable."
            fi

            if curl -fsS --max-time 3 \
              -H "Authorization: Bearer $CLUSTER_KEY" \
              "http://${CODER_IP}:9002/health" >/dev/null 2>&1; then
              WARN_C=0
            else
              WARN_C=$((WARN_C + 1))
              [ "$WARN_C" -ne 1 ] || echo "::warning::Coder specialist temporarily unavailable; manager can still answer without delegation."
            fi

            sleep 60
          done
