name: Local AI Agentic Cluster v2.1.1

on:
  workflow_dispatch:
    inputs:
      general_model:
        description: "General / vision / web model"
        required: true
        type: choice
        default: qwen3.5:9b
        options:
          - qwen3.5:4b
          - qwen3.5:9b
          - qwen3:8b

      coder_model:
        description: "Coding model"
        required: true
        type: choice
        default: qwen2.5-coder:7b
        options:
          - qwen2.5-coder:7b
          - qwen3.5:4b
          - qwen3.5:9b

      general_context:
        description: "Context General/Manager (16K recommended for files + web)"
        required: true
        type: choice
        default: "16384"
        options:
          - "8192"
          - "16384"
          - "24576"

      coder_context:
        description: "Context Coder specialist (8K is faster on CPU)"
        required: true
        type: choice
        default: "8192"
        options:
          - "8192"
          - "16384"
          - "24576"

      thinking:
        description: "Default reasoning"
        required: true
        type: choice
        default: "off"
        options:
          - "off"
          - "medium"

      web:
        description: "Native Web Search"
        required: true
        type: choice
        default: "on"
        options:
          - "on"
          - "off"

      tailscale_auth:
        description: "Private network auth"
        required: true
        type: choice
        default: authkey-easy
        options:
          - authkey-easy
          - oidc-recommended

      tunnel:
        description: "Public tunnel for Open WebUI only"
        required: true
        type: choice
        default: ngrok-stable
        options:
          - ngrok-stable
          - cloudflare-named

# No repository contents permission. id-token is only needed for the optional
# Tailscale OIDC/WIF mode.
permissions:
  id-token: write

concurrency:
  group: local-ai-cluster-${{ github.repository }}
  cancel-in-progress: true

jobs:
  ai-workers:
    name: "AI Worker / ${{ matrix.role }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        role: [general, coder]

    env:
      BASE: /home/runner/localai
      OLLAMA_MODELS: /home/runner/localai/models
      LOCAL_AI_PASSWORD: ${{ secrets.LOCAL_AI_PASSWORD }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}

    steps:
      - name: Owner guard + validate secrets
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          if [ "$GITHUB_ACTOR" != "$GITHUB_REPOSITORY_OWNER" ]; then
            echo "::error::Hanya repository owner yang boleh menjalankan cluster."
            exit 1
          fi

          if [ -z "${LOCAL_AI_PASSWORD:-}" ]; then
            echo "::error::Secret LOCAL_AI_PASSWORD belum dibuat."
            exit 1
          fi
          echo "::add-mask::$LOCAL_AI_PASSWORD"

          if [ "${{ inputs.tailscale_auth }}" = "authkey-easy" ]; then
            if [ -z "${TAILSCALE_AUTHKEY:-}" ]; then
              echo "::error::Secret TAILSCALE_AUTHKEY belum dibuat."
              exit 1
            fi
            echo "::add-mask::$TAILSCALE_AUTHKEY"
          else
            if [ -z "${TS_OAUTH_CLIENT_ID:-}" ] || [ -z "${TS_AUDIENCE:-}" ]; then
              echo "::error::OIDC membutuhkan TS_OAUTH_CLIENT_ID dan TS_AUDIENCE."
              exit 1
            fi
            echo "::add-mask::$TS_OAUTH_CLIENT_ID"
            echo "::add-mask::$TS_AUDIENCE"
          fi

          mkdir -p "$BASE/models" "$BASE/bin" "$BASE/logs"
          chmod -R go-rwx "$BASE"

          ROLE="${{ matrix.role }}"
          if [ "$ROLE" = "general" ]; then
            MODEL="${{ inputs.general_model }}"
            CONTEXT="${{ inputs.general_context }}"
            GATEWAY_PORT=9001
          else
            MODEL="${{ inputs.coder_model }}"
            CONTEXT="${{ inputs.coder_context }}"
            GATEWAY_PORT=9002
          fi

          HOSTNAME="ai-${ROLE}-${GITHUB_RUN_ID}"
          CLUSTER_KEY="$(printf '%s' "${LOCAL_AI_PASSWORD}:${GITHUB_RUN_ID}:local-ai-agentic-v2.1.1" | sha256sum | awk '{print $1}')"

          echo "::add-mask::$CLUSTER_KEY"
          {
            echo "ROLE=$ROLE"
            echo "MODEL=$MODEL"
            echo "CONTEXT=$CONTEXT"
            echo "GATEWAY_PORT=$GATEWAY_PORT"
            echo "TS_HOSTNAME=$HOSTNAME"
            echo "CLUSTER_KEY=$CLUSTER_KEY"
          } >> "$GITHUB_ENV"

          echo "Role=$ROLE"
          echo "Model=$MODEL"
          echo "Hostname=$HOSTNAME"
          echo "No actions/checkout; repository source is not mounted."

      - name: Tailscale / auth key
        if: ${{ inputs.tailscale_auth == 'authkey-easy' }}
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: ${{ env.TS_HOSTNAME }}
          use-cache: "false"
          log-mode: grouped

      - name: Tailscale / OIDC WIF
        if: ${{ inputs.tailscale_auth == 'oidc-recommended' }}
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          hostname: ${{ env.TS_HOSTNAME }}
          use-cache: "false"
          log-mode: grouped

      - name: Record private Tailscale address
        shell: bash
        run: |
          set -euo pipefail
          TS_IP="$(tailscale ip -4 | head -1)"
          if [ -z "$TS_IP" ]; then
            echo "::error::Tailscale IPv4 tidak ditemukan."
            exit 1
          fi
          echo "TS_IP=$TS_IP" >> "$GITHUB_ENV"
          echo "Tailscale node ready: $TS_HOSTNAME"

      - name: Adaptive Linux memory tuning
        shell: bash
        run: |
          set -euo pipefail

          echo "===== BEFORE ====="
          free -h
          df -h /

          # Extra swap is only created when the runner really has spare disk.
          # GitHub does not guarantee the large free disk seen on every run.
          FREE_KB="$(df --output=avail -k / | tail -1 | tr -d ' ')"
          if [ "$FREE_KB" -gt $((35 * 1024 * 1024)) ]; then
            SWAPFILE="/swapfile-localai"
            if ! swapon --show=NAME | grep -qx "$SWAPFILE"; then
              sudo fallocate -l 8G "$SWAPFILE"
              sudo chmod 600 "$SWAPFILE"
              sudo mkswap "$SWAPFILE" >/dev/null
              sudo swapon "$SWAPFILE"
            fi
          else
            echo "Extra swap skipped: preserving disk space."
          fi

          sudo sysctl -w vm.swappiness=10 >/dev/null
          sudo sysctl -w vm.page-cluster=0 >/dev/null

          echo "MALLOC_ARENA_MAX=2" >> "$GITHUB_ENV"

          echo "===== AFTER ====="
          free -h
          swapon --show || true

      - name: Install Ollama
        shell: bash
        run: |
          set -euo pipefail

          curl --proto '=https' --tlsv1.2 -fsSL https://ollama.com/install.sh | sh

          sudo systemctl stop ollama 2>/dev/null || true
          pkill -f 'ollama serve' 2>/dev/null || true
          sleep 1

          ollama --version

      - name: Start private Ollama
        shell: bash
        run: |
          set -euo pipefail

          # Ollama never binds to the public interface or the Tailscale interface.
          # Only the narrow authenticated gateway below can reach it.
          nohup env \
            OLLAMA_HOST=127.0.0.1:11434 \
            OLLAMA_MODELS="$OLLAMA_MODELS" \
            OLLAMA_CONTEXT_LENGTH="$CONTEXT" \
            OLLAMA_MAX_LOADED_MODELS=1 \
            OLLAMA_NUM_PARALLEL=1 \
            OLLAMA_MAX_QUEUE=8 \
            OLLAMA_KEEP_ALIVE=-1 \
            OLLAMA_FLASH_ATTENTION=1 \
            OLLAMA_KV_CACHE_TYPE=q8_0 \
            MALLOC_ARENA_MAX=2 \
            ollama serve \
            >"$BASE/logs/ollama.log" 2>&1 &

          echo $! > "$BASE/ollama.pid"

          for i in {1..120}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
              echo "Ollama API ready."
              exit 0
            fi
            sleep 1
          done

          tail -200 "$BASE/logs/ollama.log" || true
          echo "::error::Ollama gagal start."
          exit 1

      - name: Pull role-specific model
        shell: bash
        run: |
          set -euo pipefail
          START="$(date +%s)"

          ollama pull "$MODEL"

          END="$(date +%s)"
          echo "Model download completed in $((END - START))s."
          ollama list
          free -h

      - name: Warm model
        shell: bash
        run: |
          set -euo pipefail

          PAYLOAD="$(jq -cn \
            --arg model "$MODEL" \
            '{
              model:$model,
              messages:[{role:"user",content:"Balas hanya OK"}],
              stream:false,
              think:false,
              keep_alive:-1,
              options:{num_predict:16,temperature:0}
            }'
          )"

          START="$(date +%s)"
          RESPONSE="$(curl -fsS --max-time 300 \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD" \
            http://127.0.0.1:11434/api/chat)"
          END="$(date +%s)"

          ANSWER="$(echo "$RESPONSE" | jq -r '.message.content // empty' | head -c 120)"
          echo "Warm response: $ANSWER"
          echo "Warm total: $((END - START))s"
          ollama ps || true

          {
            echo "## Worker: $ROLE"
            echo
            echo "- Model: \`$MODEL\`"
            echo "- Context: **$CONTEXT**"
            echo "- Warm request: **$((END - START))s**"
            echo "- Ollama: localhost only"
            echo "- Gateway: authenticated + Tailscale-only"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create narrow authenticated worker gateway + profiler
        shell: bash
        run: |
          set -euo pipefail

          cat > "$BASE/worker_gateway.py" <<'PY'
          import json
          import os
          import hmac
          import http.client
          import time
          from collections import deque
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          ROLE = os.environ["ROLE"]
          MODEL = os.environ["MODEL"]
          KEY = os.environ["CLUSTER_KEY"]
          BIND = os.environ["TS_IP"]
          PORT = int(os.environ["GATEWAY_PORT"])
          METRICS = deque(maxlen=20)

          def send_json(handler, status, obj):
              data = json.dumps(obj, separators=(",", ":")).encode()
              handler.send_response(status)
              handler.send_header("Content-Type", "application/json")
              handler.send_header("Content-Length", str(len(data)))
              handler.send_header("Connection", "close")
              handler.end_headers()
              handler.wfile.write(data)
              handler.close_connection = True

          class Handler(BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"

              def log_message(self, fmt, *args):
                  print(f"[{ROLE}] {self.address_string()} - {fmt % args}", flush=True)

              def authorized(self):
                  expected = f"Bearer {KEY}"
                  supplied = self.headers.get("Authorization", "")
                  return hmac.compare_digest(supplied, expected)

              def do_GET(self):
                  if not self.authorized():
                      send_json(self, 401, {"error": "unauthorized"})
                      return

                  if self.path == "/health":
                      send_json(self, 200, {"status":"ok", "role":ROLE, "model":MODEL})
                      return
                  if self.path == "/metrics":
                      send_json(self, 200, {"role":ROLE, "requests":list(METRICS)})
                      return
                  send_json(self, 404, {"error": "not_found"})

              def do_POST(self):
                  if not self.authorized():
                      send_json(self, 401, {"error": "unauthorized"})
                      return
                  if self.path != "/v1/chat/completions":
                      send_json(self, 404, {"error": "not_found"})
                      return

                  started = time.monotonic()
                  first_byte = None
                  out_bytes = 0
                  try:
                      length = int(self.headers.get("Content-Length", "0"))
                      raw = self.rfile.read(length)
                      body = json.loads(raw.decode("utf-8"))
                      body["model"] = MODEL
                      raw = json.dumps(body, separators=(",", ":")).encode("utf-8")

                      conn = http.client.HTTPConnection("127.0.0.1", 11434, timeout=1800)
                      conn.request(
                          "POST", "/v1/chat/completions", body=raw,
                          headers={
                              "Content-Type":"application/json",
                              "Authorization":"Bearer ollama",
                              "Connection":"close",
                          },
                      )
                      resp = conn.getresponse()

                      self.send_response(resp.status)
                      ctype = resp.getheader("Content-Type")
                      if ctype:
                          self.send_header("Content-Type", ctype)
                      cache = resp.getheader("Cache-Control")
                      if cache:
                          self.send_header("Cache-Control", cache)
                      self.send_header("Connection", "close")
                      self.end_headers()

                      while True:
                          chunk = resp.read1(16384)
                          if not chunk:
                              break
                          if first_byte is None:
                              first_byte = time.monotonic()
                          out_bytes += len(chunk)
                          self.wfile.write(chunk)
                          self.wfile.flush()

                      total = time.monotonic() - started
                      ttft = (first_byte - started) if first_byte else total
                      metric = {
                          "status": resp.status,
                          "request_bytes": length,
                          "response_bytes": out_bytes,
                          "ttft_s": round(ttft, 3),
                          "total_s": round(total, 3),
                      }
                      METRICS.append(metric)
                      print(
                          f"[{ROLE}] request_bytes={length} status={resp.status} "
                          f"ttft={ttft:.2f}s total={total:.2f}s response_bytes={out_bytes}",
                          flush=True,
                      )
                      conn.close()
                      self.close_connection = True
                  except Exception as exc:
                      print("[" + ROLE + "] proxy error:", repr(exc), flush=True)
                      try:
                          send_json(self, 502, {"error":"worker_proxy_error"})
                      except Exception:
                          pass

          print(f"Worker gateway role={ROLE} bind={BIND}:{PORT} model={MODEL}", flush=True)
          ThreadingHTTPServer((BIND, PORT), Handler).serve_forever()
          PY

          python3 -m py_compile "$BASE/worker_gateway.py"
          echo "worker_gateway.py syntax-check: PASS"
          sha256sum "$BASE/worker_gateway.py"

          nohup env \
            ROLE="$ROLE" \
            MODEL="$MODEL" \
            CLUSTER_KEY="$CLUSTER_KEY" \
            TS_IP="$TS_IP" \
            GATEWAY_PORT="$GATEWAY_PORT" \
            python3 "$BASE/worker_gateway.py" \
            >"$BASE/logs/gateway.log" 2>&1 &

          echo $! > "$BASE/gateway.pid"

          for i in {1..60}; do
            if curl -fsS \
              -H "Authorization: Bearer $CLUSTER_KEY" \
              "http://${TS_IP}:${GATEWAY_PORT}/health" >/dev/null 2>&1; then
              echo "Worker gateway ready."
              exit 0
            fi
            sleep 1
          done

          tail -100 "$BASE/logs/gateway.log" || true
          echo "::error::Worker gateway gagal start."
          exit 1

      - name: Keep worker alive while frontend exists
        shell: bash
        run: |
          set -euo pipefail

          FRONT_HOST="ai-front-${GITHUB_RUN_ID}"
          FRONT_SEEN=0
          MISSES=0
          START="$(date +%s)"

          echo "Worker ready. Waiting for frontend peer: $FRONT_HOST"

          while true; do
            kill -0 "$(cat "$BASE/ollama.pid")" 2>/dev/null || {
              echo "::error::Ollama process stopped."
              tail -200 "$BASE/logs/ollama.log" || true
              exit 1
            }

            kill -0 "$(cat "$BASE/gateway.pid")" 2>/dev/null || {
              echo "::error::Gateway process stopped."
              tail -200 "$BASE/logs/gateway.log" || true
              exit 1
            }

            FOUND="$(tailscale status --json 2>/dev/null | \
              jq -r --arg h "$FRONT_HOST" \
              '[.Peer[]? | select(.HostName == $h)] | length' 2>/dev/null || echo 0)"

            if [ "$FOUND" -gt 0 ]; then
              FRONT_SEEN=1
              MISSES=0
            elif [ "$FRONT_SEEN" -eq 1 ]; then
              MISSES=$((MISSES + 1))
            fi

            # If the frontend existed and then disappeared for 5 minutes,
            # stop wasting a hosted runner.
            if [ "$MISSES" -ge 5 ]; then
              echo "Frontend peer disappeared; worker exits."
              exit 0
            fi

            # Also exit if the frontend never appears within 20 minutes.
            NOW="$(date +%s)"
            if [ "$FRONT_SEEN" -eq 0 ] && [ $((NOW - START)) -gt 1200 ]; then
              echo "::error::Frontend peer never appeared."
              exit 1
            fi

            sleep 60
          done

  frontend:
    name: "Frontend / Router / WebUI"
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      BASE: /home/runner/localai
      LOCAL_AI_PASSWORD: ${{ secrets.LOCAL_AI_PASSWORD }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
      NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
      CF_PUBLIC_URL: ${{ vars.CF_PUBLIC_URL }}

    steps:
      - name: Owner guard + validate secrets
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          if [ "$GITHUB_ACTOR" != "$GITHUB_REPOSITORY_OWNER" ]; then
            echo "::error::Hanya repository owner yang boleh menjalankan cluster."
            exit 1
          fi

          if [ -z "${LOCAL_AI_PASSWORD:-}" ]; then
            echo "::error::Secret LOCAL_AI_PASSWORD belum dibuat."
            exit 1
          fi
          echo "::add-mask::$LOCAL_AI_PASSWORD"

          if [ "${{ inputs.tailscale_auth }}" = "authkey-easy" ]; then
            if [ -z "${TAILSCALE_AUTHKEY:-}" ]; then
              echo "::error::Secret TAILSCALE_AUTHKEY belum dibuat."
              exit 1
            fi
            echo "::add-mask::$TAILSCALE_AUTHKEY"
          else
            if [ -z "${TS_OAUTH_CLIENT_ID:-}" ] || [ -z "${TS_AUDIENCE:-}" ]; then
              echo "::error::OIDC membutuhkan TS_OAUTH_CLIENT_ID dan TS_AUDIENCE."
              exit 1
            fi
            echo "::add-mask::$TS_OAUTH_CLIENT_ID"
            echo "::add-mask::$TS_AUDIENCE"
          fi

          if [ "${{ inputs.tunnel }}" = "ngrok-stable" ]; then
            if [ -z "${NGROK_AUTHTOKEN:-}" ]; then
              echo "::error::Secret NGROK_AUTHTOKEN belum dibuat."
              exit 1
            fi
            echo "::add-mask::$NGROK_AUTHTOKEN"
          else
            if [ -z "${CF_TUNNEL_TOKEN:-}" ] || [ -z "${CF_PUBLIC_URL:-}" ]; then
              echo "::error::Cloudflare membutuhkan CF_TUNNEL_TOKEN dan CF_PUBLIC_URL."
              exit 1
            fi
            echo "::add-mask::$CF_TUNNEL_TOKEN"
          fi

          mkdir -p "$BASE/bin" "$BASE/logs" "$BASE/openwebui-data"
          chmod -R go-rwx "$BASE"

          TS_HOSTNAME="ai-front-${GITHUB_RUN_ID}"
          CLUSTER_KEY="$(printf '%s' "${LOCAL_AI_PASSWORD}:${GITHUB_RUN_ID}:local-ai-agentic-v2.1.1" | sha256sum | awk '{print $1}')"

          echo "::add-mask::$CLUSTER_KEY"
          {
            echo "TS_HOSTNAME=$TS_HOSTNAME"
            echo "CLUSTER_KEY=$CLUSTER_KEY"
            echo "GENERAL_HOST=ai-general-${GITHUB_RUN_ID}"
            echo "CODER_HOST=ai-coder-${GITHUB_RUN_ID}"
          } >> "$GITHUB_ENV"

          echo "Frontend hostname=$TS_HOSTNAME"
          echo "No actions/checkout; repository source is not mounted."

      - name: Tailscale / auth key
        if: ${{ inputs.tailscale_auth == 'authkey-easy' }}
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: ${{ env.TS_HOSTNAME }}
          use-cache: "false"
          log-mode: grouped

      - name: Tailscale / OIDC WIF
        if: ${{ inputs.tailscale_auth == 'oidc-recommended' }}
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          hostname: ${{ env.TS_HOSTNAME }}
          use-cache: "false"
          log-mode: grouped

      - name: Wait for both private workers
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for:"
          echo "  $GENERAL_HOST"
          echo "  $CODER_HOST"

          GENERAL_IP=""
          CODER_IP=""

          for i in {1..240}; do
            STATUS="$(tailscale status --json 2>/dev/null || echo '{}')"

            GENERAL_IP="$(echo "$STATUS" | jq -r --arg h "$GENERAL_HOST" \
              '.Peer[]? | select(.HostName == $h) | .TailscaleIPs[0]' | head -1)"
            CODER_IP="$(echo "$STATUS" | jq -r --arg h "$CODER_HOST" \
              '.Peer[]? | select(.HostName == $h) | .TailscaleIPs[0]' | head -1)"

            G_OK=0
            C_OK=0

            if [ -n "$GENERAL_IP" ]; then
              curl -fsS --max-time 3 \
                -H "Authorization: Bearer $CLUSTER_KEY" \
                "http://${GENERAL_IP}:9001/health" >/dev/null 2>&1 && G_OK=1
            fi

            if [ -n "$CODER_IP" ]; then
              curl -fsS --max-time 3 \
                -H "Authorization: Bearer $CLUSTER_KEY" \
                "http://${CODER_IP}:9002/health" >/dev/null 2>&1 && C_OK=1
            fi

            if [ "$G_OK" -eq 1 ] && [ "$C_OK" -eq 1 ]; then
              {
                echo "GENERAL_IP=$GENERAL_IP"
                echo "CODER_IP=$CODER_IP"
              } >> "$GITHUB_ENV"

              echo "Both workers are ready."
              exit 0
            fi

            if (( i % 12 == 0 )); then
              echo "Still waiting... general=$G_OK coder=$C_OK"
            fi

            sleep 5
          done

          echo "::error::Workers did not become ready within 20 minutes."
          tailscale status || true
          exit 1

      - name: Measure private network path
        shell: bash
        run: |
          set -euo pipefail

          G_PING="$(tailscale ping -c 1 "$GENERAL_IP" 2>&1 || true)"
          C_PING="$(tailscale ping -c 1 "$CODER_IP" 2>&1 || true)"

          echo "GENERAL: $G_PING"
          echo "CODER:   $C_PING"

          {
            echo "## 🌐 Cluster network"
            echo
            echo "- General worker: \`$GENERAL_HOST\`"
            echo "- Coder worker: \`$CODER_HOST\`"
            echo "- General path: \`$(echo "$G_PING" | tail -1 | tr '\`' ' ' | head -c 180)\`"
            echo "- Coder path: \`$(echo "$C_PING" | tail -1 | tr '\`' ' ' | head -c 180)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create Manager model gateway (no keyword routing)
        shell: bash
        run: |
          set -euo pipefail

          cat > "$BASE/router.py" <<'PY'
          import json
          import os
          import hmac
          import time
          import http.client
          from collections import deque
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          KEY = os.environ["CLUSTER_KEY"]
          GENERAL_IP = os.environ["GENERAL_IP"]
          THINKING = os.environ.get("THINKING_DEFAULT", "off")
          METRICS = deque(maxlen=30)

          def send_json(handler, status, obj):
              data = json.dumps(obj, separators=(",", ":")).encode()
              handler.send_response(status)
              handler.send_header("Content-Type", "application/json")
              handler.send_header("Content-Length", str(len(data)))
              handler.send_header("Connection", "close")
              handler.end_headers()
              handler.wfile.write(data)
              handler.close_connection = True

          def forward(handler, body):
              raw = json.dumps(body, separators=(",", ":")).encode("utf-8")
              started = time.monotonic()
              first_byte = None
              out_bytes = 0

              conn = http.client.HTTPConnection(GENERAL_IP, 9001, timeout=1800)
              conn.request(
                  "POST", "/v1/chat/completions", body=raw,
                  headers={
                      "Content-Type":"application/json",
                      "Authorization":f"Bearer {KEY}",
                      "Connection":"close",
                  },
              )
              resp = conn.getresponse()

              handler.send_response(resp.status)
              ctype = resp.getheader("Content-Type")
              if ctype:
                  handler.send_header("Content-Type", ctype)
              cache = resp.getheader("Cache-Control")
              if cache:
                  handler.send_header("Cache-Control", cache)
              handler.send_header("X-Local-AI-Worker", "general-manager")
              handler.send_header("Connection", "close")
              handler.end_headers()

              while True:
                  chunk = resp.read1(16384)
                  if not chunk:
                      break
                  if first_byte is None:
                      first_byte = time.monotonic()
                  out_bytes += len(chunk)
                  handler.wfile.write(chunk)
                  handler.wfile.flush()

              total = time.monotonic() - started
              ttft = (first_byte - started) if first_byte else total
              metric = {
                  "request_bytes": len(raw),
                  "response_bytes": out_bytes,
                  "status": resp.status,
                  "ttft_s": round(ttft, 3),
                  "total_s": round(total, 3),
              }
              METRICS.append(metric)
              print(
                  f"manager request_bytes={len(raw)} status={resp.status} "
                  f"ttft={ttft:.2f}s total={total:.2f}s response_bytes={out_bytes}",
                  flush=True,
              )
              conn.close()
              handler.close_connection = True

          class Handler(BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"

              def log_message(self, fmt, *args):
                  print(f"[manager] {self.address_string()} - {fmt % args}", flush=True)

              def authorized(self):
                  expected = f"Bearer {KEY}"
                  supplied = self.headers.get("Authorization", "")
                  return hmac.compare_digest(supplied, expected)

              def do_GET(self):
                  if not self.authorized() and self.path != "/health":
                      send_json(self, 401, {"error":"unauthorized"})
                      return
                  if self.path == "/health":
                      send_json(self, 200, {"status":"ok", "model":"local-agent-base"})
                      return
                  if self.path == "/metrics":
                      send_json(self, 200, {"requests":list(METRICS)})
                      return
                  if self.path == "/v1/models":
                      send_json(self, 200, {
                          "object":"list",
                          "data":[{"id":"local-agent-base","object":"model","created":0,"owned_by":"local-ai-cluster"}],
                      })
                      return
                  if self.path == "/v1/models/local-agent-base":
                      send_json(self, 200, {
                          "id":"local-agent-base","object":"model","created":0,"owned_by":"local-ai-cluster"
                      })
                      return
                  send_json(self, 404, {"error":"not_found"})

              def do_POST(self):
                  if not self.authorized():
                      send_json(self, 401, {"error":"unauthorized"})
                      return
                  if self.path != "/v1/chat/completions":
                      send_json(self, 404, {"error":"not_found"})
                      return
                  try:
                      length = int(self.headers.get("Content-Length", "0"))
                      raw = self.rfile.read(length)
                      body = json.loads(raw.decode("utf-8"))
                      body["model"] = "local-agent-base"
                      if THINKING == "off":
                          body.setdefault("reasoning_effort", "none")
                      elif THINKING == "medium":
                          body.setdefault("reasoning_effort", "medium")
                      forward(self, body)
                  except Exception as exc:
                      print("manager error:", repr(exc), flush=True)
                      try:
                          send_json(self, 502, {"error":{"message":"General manager worker unavailable","type":"cluster_error"}})
                      except Exception:
                          pass

          print(f"Manager gateway -> {GENERAL_IP}:9001 thinking={THINKING}", flush=True)
          ThreadingHTTPServer(("127.0.0.1", 8000), Handler).serve_forever()
          PY

          python3 -m py_compile "$BASE/router.py"
          echo "router.py syntax-check: PASS"
          sha256sum "$BASE/router.py"
          nohup env \
            CLUSTER_KEY="$CLUSTER_KEY" \
            GENERAL_IP="$GENERAL_IP" \
            THINKING_DEFAULT="${{ inputs.thinking }}" \
            python3 "$BASE/router.py" \
            >"$BASE/logs/router.log" 2>&1 &
          echo $! > "$BASE/router.pid"

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "Manager gateway ready."
              exit 0
            fi
            sleep 1
          done

          tail -100 "$BASE/logs/router.log" || true
          echo "::error::Manager gateway gagal start."
          exit 1

      - name: Create Coder specialist OpenAPI tool
        shell: bash
        run: |
          set -euo pipefail

          cat > "$BASE/coder_tool.py" <<'PY'
          import json
          import os
          import hmac
          import time
          import http.client
          from collections import deque
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          KEY = os.environ["CLUSTER_KEY"]
          CODER_IP = os.environ["CODER_IP"]
          METRICS = deque(maxlen=20)

          SPEC = {
              "openapi":"3.1.0",
              "info":{
                  "title":"Local Coder Specialist",
                  "version":"2.1.0",
                  "description":"A private specialist worker for software engineering tasks."
              },
              "paths":{
                  "/delegate":{
                      "post":{
                          "operationId":"delegate_to_coder",
                          "summary":"Delegate a software engineering task to the coder specialist",
                          "description":(
                              "Use when a task materially benefits from a specialist in programming, debugging, "
                              "code review, build systems, Android/APK, native libraries, Git, CI, architecture, "
                              "or implementation. Decide semantically from the user's goal; no trigger words are required. "
                              "Do not use for ordinary factual or conversational questions. Pass only the task and the "
                              "small amount of context the specialist actually needs."
                          ),
                          "requestBody":{
                              "required":True,
                              "content":{
                                  "application/json":{
                                      "schema":{
                                          "type":"object",
                                          "properties":{
                                              "task":{
                                                  "type":"string",
                                                  "description":"The concrete software-engineering goal for the specialist."
                                              },
                                              "context":{
                                                  "type":"string",
                                                  "description":"Optional relevant snippets, errors, or facts already gathered by the manager. Keep concise."
                                              }
                                          },
                                          "required":["task"]
                                      }
                                  }
                              }
                          },
                          "responses":{
                              "200":{
                                  "description":"Specialist report",
                                  "content":{"application/json":{"schema":{"type":"object","properties":{"result":{"type":"string"}}}}}
                              }
                          }
                      }
                  }
              }
          }

          def send_json(h, status, obj):
              data = json.dumps(obj, separators=(",", ":")).encode()
              h.send_response(status)
              h.send_header("Content-Type","application/json")
              h.send_header("Content-Length",str(len(data)))
              h.send_header("Connection","close")
              h.end_headers()
              h.wfile.write(data)
              h.close_connection = True

          class Handler(BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"

              def log_message(self, fmt, *args):
                  print(f"[coder-tool] {self.address_string()} - {fmt % args}", flush=True)

              def authorized(self):
                  return hmac.compare_digest(
                      self.headers.get("Authorization", ""), f"Bearer {KEY}"
                  )

              def do_GET(self):
                  if self.path == "/health":
                      if not self.authorized():
                          send_json(self, 401, {"error":"unauthorized"})
                      else:
                          send_json(self, 200, {"status":"ok"})
                      return
                  if self.path in ("/openapi.json", "/openapi.json/"):
                      if not self.authorized():
                          send_json(self, 401, {"error":"unauthorized"})
                      else:
                          send_json(self, 200, SPEC)
                      return
                  if self.path == "/metrics":
                      if not self.authorized():
                          send_json(self, 401, {"error":"unauthorized"})
                      else:
                          send_json(self, 200, {"requests":list(METRICS)})
                      return
                  send_json(self, 404, {"error":"not_found"})

              def do_POST(self):
                  if not self.authorized():
                      send_json(self, 401, {"error":"unauthorized"})
                      return
                  if self.path != "/delegate":
                      send_json(self, 404, {"error":"not_found"})
                      return

                  started = time.monotonic()
                  try:
                      length = int(self.headers.get("Content-Length", "0"))
                      data = json.loads(self.rfile.read(length).decode("utf-8"))
                      task = str(data.get("task", "")).strip()
                      context = str(data.get("context", "")).strip()
                      if not task:
                          send_json(self, 400, {"error":"task_required"})
                          return

                      system = (
                          "You are a specialist software-engineering subagent. Solve the delegated task carefully. "
                          "Return a compact actionable report to the manager agent. Do not chat with the end user, "
                          "do not invent files or command results, and do not claim tools were executed unless the "
                          "provided context proves it. Prefer concrete diagnosis, code, and next steps."
                      )
                      user = f"TASK:\n{task}"
                      if context:
                          user += f"\n\nRELEVANT CONTEXT:\n{context[:16000]}"

                      payload = {
                          "model":"local-agent-base",
                          "messages":[
                              {"role":"system","content":system},
                              {"role":"user","content":user},
                          ],
                          "stream":False,
                          "temperature":0.15,
                          "max_tokens":1000,
                          "reasoning_effort":"none",
                      }
                      raw = json.dumps(payload, separators=(",", ":")).encode()

                      conn = http.client.HTTPConnection(CODER_IP, 9002, timeout=900)
                      conn.request(
                          "POST", "/v1/chat/completions", body=raw,
                          headers={
                              "Content-Type":"application/json",
                              "Authorization":f"Bearer {KEY}",
                              "Connection":"close",
                          },
                      )
                      resp = conn.getresponse()
                      body = resp.read()
                      if resp.status >= 400:
                          raise RuntimeError(f"coder worker HTTP {resp.status}: {body[:300]!r}")
                      obj = json.loads(body.decode("utf-8"))
                      result = (((obj.get("choices") or [{}])[0].get("message") or {}).get("content") or "").strip()
                      total = time.monotonic() - started
                      METRICS.append({"total_s":round(total,3), "task_chars":len(task), "context_chars":len(context)})
                      print(
                          f"[coder-tool] delegated task_chars={len(task)} context_chars={len(context)} total={total:.2f}s",
                          flush=True,
                      )
                      send_json(self, 200, {"result":result or "Coder specialist returned no text."})
                      conn.close()
                  except Exception as exc:
                      print("[coder-tool] error:", repr(exc), flush=True)
                      send_json(self, 502, {"error":"coder_unavailable", "detail":str(exc)[:300]})

          print(f"Coder OpenAPI tool -> {CODER_IP}:9002", flush=True)
          ThreadingHTTPServer(("127.0.0.1", 9100), Handler).serve_forever()
          PY

          if ! python3 -m py_compile "$BASE/coder_tool.py"; then
            echo "::error::coder_tool.py gagal syntax-check. Menampilkan area sekitar baris error:"
            nl -ba "$BASE/coder_tool.py" | sed -n '150,190p' || true
            sha256sum "$BASE/coder_tool.py" || true
            exit 1
          fi
          echo "coder_tool.py syntax-check: PASS"
          sha256sum "$BASE/coder_tool.py"
          nohup env \
            CLUSTER_KEY="$CLUSTER_KEY" \
            CODER_IP="$CODER_IP" \
            python3 "$BASE/coder_tool.py" \
            >"$BASE/logs/coder-tool.log" 2>&1 &
          echo $! > "$BASE/coder-tool.pid"

          for i in {1..60}; do
            if curl -fsS \
              -H "Authorization: Bearer $CLUSTER_KEY" \
              http://127.0.0.1:9100/health >/dev/null 2>&1; then
              echo "Coder specialist tool ready."
              exit 0
            fi
            sleep 1
          done

          tail -100 "$BASE/logs/coder-tool.log" || true
          echo "::error::Coder tool server gagal start."
          exit 1

