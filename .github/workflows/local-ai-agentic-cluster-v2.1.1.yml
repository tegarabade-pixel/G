      - name: Start public tunnel and resolve WEBUI_URL
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ inputs.tunnel }}" = "ngrok-stable" ]; then
            curl --proto '=https' --tlsv1.2 -fsSL \
              https://bin.ngrok.com/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz \
              | tar -xz -C "$BASE/bin"

            chmod 700 "$BASE/bin/ngrok"

            "$BASE/bin/ngrok" config add-authtoken "$NGROK_AUTHTOKEN" \
              --config "$BASE/ngrok.yml" >/dev/null

            nohup "$BASE/bin/ngrok" http 8080 \
              --config "$BASE/ngrok.yml" \
              --log stdout \
              --log-format json \
              >"$BASE/logs/ngrok.log" 2>&1 &

            echo $! > "$BASE/tunnel.pid"

            URL=""
            for i in {1..90}; do
              URL="$(curl -fsS http://127.0.0.1:4040/api/tunnels 2>/dev/null \
                | jq -r '.tunnels[]? | select(.proto == "https") | .public_url' \
                | head -1 || true)"
              [ -n "$URL" ] && break
              sleep 1
            done

            if [ -z "$URL" ]; then
              tail -100 "$BASE/logs/ngrok.log" || true
              echo "::error::ngrok tidak menghasilkan URL."
              exit 1
            fi
          else
            curl --proto '=https' --tlsv1.2 -fsSL \
              https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
              -o "$BASE/bin/cloudflared"
            chmod 700 "$BASE/bin/cloudflared"

            nohup "$BASE/bin/cloudflared" tunnel \
              --no-autoupdate \
              run \
              --token "$CF_TUNNEL_TOKEN" \
              >"$BASE/logs/cloudflared.log" 2>&1 &

            echo $! > "$BASE/tunnel.pid"
            URL="$CF_PUBLIC_URL"
          fi

          echo "PUBLIC_URL=$URL" >> "$GITHUB_ENV"
          echo "Public URL allocated."

