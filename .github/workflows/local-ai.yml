name: Local AI Launcher Hardened

on:
  workflow_dispatch:

# Tidak memberi GITHUB_TOKEN permission apa pun.
permissions: {}

# Hanya satu instance AI aktif pada repo ini.
concurrency:
  group: local-ai-${{ github.repository }}
  cancel-in-progress: true

jobs:
  local-ai:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      BASE: /home/runner/localai
      SELECT_FILE: /home/runner/localai/selection.json
      STATUS_FILE: /home/runner/localai/status.txt
      OLLAMA_MODELS: /home/runner/localai/models
      LOCAL_AI_PASSWORD: ${{ secrets.LOCAL_AI_PASSWORD }}

    steps:
      - name: Harden runner and authorize owner
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          # Extra guard: hanya pemilik repository yang boleh meneruskan job.
          if [ "$GITHUB_ACTOR" != "$GITHUB_REPOSITORY_OWNER" ]; then
            echo "::error::Workflow ini hanya boleh dijalankan oleh repository owner."
            exit 1
          fi

          if [ -z "${LOCAL_AI_PASSWORD:-}" ]; then
            echo "::error::Repository secret LOCAL_AI_PASSWORD belum dibuat."
            exit 1
          fi

          # Tambahan masking; GitHub Secrets sendiri juga dimask.
          echo "::add-mask::$LOCAL_AI_PASSWORD"

          mkdir -p "$BASE"
          chmod 700 "$BASE"

          echo "Owner check: OK"
          echo "GITHUB_TOKEN permissions: none"
          echo "Repository tidak di-checkout."

      - name: Prepare private workspace
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          mkdir -p \
            "$BASE/bin" \
            "$BASE/models" \
            "$BASE/openwebui-data" \
            "$BASE/workspace/uploads" \
            "$BASE/workspace/projects" \
            "$BASE/workspace/outputs" \
            "$BASE/custom" \
            "$BASE/logs"

          chmod -R go-rwx "$BASE"
          rm -f "$SELECT_FILE"
          echo "Launcher sedang disiapkan..." > "$STATUS_FILE"

          echo "===== SYSTEM ====="
          uname -a
          echo
          echo "===== DISK ====="
          df -h /
          echo
          echo "===== RAM ====="
          free -h
          echo
          echo "===== CPU ====="
          nproc

      - name: Create secure model selector
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          cat > "$BASE/launcher.py" <<'PY'
          import os
          import json
          import html
          import hmac
          import re
          import tempfile
          import socket
          import ipaddress
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from urllib.parse import parse_qs, urlparse

          SELECT_FILE = os.environ["SELECT_FILE"]
          STATUS_FILE = os.environ["STATUS_FILE"]
          PASSWORD = os.environ["LOCAL_AI_PASSWORD"]

          PRESETS = [
              ("qwen3:8b", "Qwen 3 8B — disarankan untuk general chat"),
              ("qwen3:14b", "Qwen 3 14B — lebih berat"),
              ("qwen2.5:14b", "Qwen 2.5 14B"),
              ("qwen2.5-coder:7b", "Qwen 2.5 Coder 7B"),
              ("qwen2.5-coder:14b", "Qwen 2.5 Coder 14B — berat"),
              ("custom_ollama", "Custom Ollama model"),
              ("custom_gguf", "Custom GGUF URL / Abliterated"),
          ]

          MODEL_RE = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._/-]{0,180}(?::[A-Za-z0-9._-]{1,80})?$")

          CSS = """
          :root{color-scheme:dark}
          *{box-sizing:border-box}
          body{margin:0;min-height:100vh;display:grid;place-items:center;
          background:#0b0d10;color:#f4f6fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:18px}
          .card{width:min(100%,590px);background:#151922;border:1px solid #2a3140;
          border-radius:22px;padding:24px;box-shadow:0 24px 70px #0007}
          h1{margin:0 0 8px;font-size:28px}
          p{color:#a7afbd;line-height:1.5}
          label{display:block;margin:16px 0 7px;font-weight:700}
          select,input{width:100%;padding:14px;border-radius:13px;border:1px solid #2a3140;
          background:#0f131a;color:#fff;font-size:16px}
          button{width:100%;margin-top:20px;padding:15px;border:0;border-radius:14px;
          font-size:16px;font-weight:800;background:#fff;color:#090a0c}
          .note{margin-top:16px;padding:13px;border:1px solid #2a3140;border-radius:13px;color:#a7afbd}
          .ok{color:#a8f0b5}.bad{color:#ffaaaa}
          """

          def status_text():
              try:
                  with open(STATUS_FILE, "r", encoding="utf-8") as f:
                      return f.read().strip()
              except Exception:
                  return "Sedang menyiapkan..."

          def already_selected():
              return os.path.exists(SELECT_FILE) and os.path.getsize(SELECT_FILE) > 0

          def page(body, refresh=None):
              meta = f'<meta http-equiv="refresh" content="{int(refresh)}">' if refresh else ""
              return f"""<!doctype html><html><head><meta charset="utf-8">
              <meta name="viewport" content="width=device-width,initial-scale=1">
              {meta}<title>Local AI</title><style>{CSS}</style></head>
              <body><main class="card">{body}</main></body></html>""".encode("utf-8")

          def is_public_https_url(value):
              try:
                  u = urlparse(value)
                  if u.scheme != "https" or not u.hostname or u.username or u.password:
                      return False
                  host = u.hostname.lower().rstrip(".")
                  if host in {"localhost"} or host.endswith(".local"):
                      return False

                  # Hindari URL internal/private jika launcher password bocor.
                  infos = socket.getaddrinfo(host, u.port or 443, type=socket.SOCK_STREAM)
                  if not infos:
                      return False
                  for info in infos:
                      ip = ipaddress.ip_address(info[4][0])
                      if (ip.is_private or ip.is_loopback or ip.is_link_local or
                          ip.is_multicast or ip.is_reserved or ip.is_unspecified):
                          return False
                  return True
              except Exception:
                  return False

          def atomic_write(data):
              os.makedirs(os.path.dirname(SELECT_FILE), exist_ok=True)
              fd, tmp = tempfile.mkstemp(prefix="selection-", suffix=".json",
                                         dir=os.path.dirname(SELECT_FILE))
              try:
                  with os.fdopen(fd, "w", encoding="utf-8") as f:
                      json.dump(data, f)
                  os.replace(tmp, SELECT_FILE)
              finally:
                  if os.path.exists(tmp):
                      os.unlink(tmp)

          class H(BaseHTTPRequestHandler):
              server_version = "LocalAILauncher/1.2"

              def log_message(self, fmt, *args):
                  # Tidak log form body/password.
                  print("%s - %s" % (self.address_string(), fmt % args), flush=True)

              def send_bytes(self, body, code=200, ctype="text/html; charset=utf-8"):
                  self.send_response(code)
                  self.send_header("Content-Type", ctype)
                  self.send_header("Cache-Control", "no-store")
                  self.send_header("X-Content-Type-Options", "nosniff")
                  self.send_header("X-Frame-Options", "DENY")
                  self.send_header("Referrer-Policy", "no-referrer")
                  self.send_header("Content-Security-Policy",
                                   "default-src 'self' 'unsafe-inline'; frame-ancestors 'none'")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  if self.path == "/health":
                      self.send_bytes(b"ok", 200, "text/plain")
                      return

                  if already_selected():
                      body = (
                          "<h1>Local AI sedang disiapkan</h1>"
                          f"<p class='ok'><b>{html.escape(status_text())}</b></p>"
                          "<p>Halaman refresh otomatis. URL yang sama akan menjadi Open WebUI.</p>"
                          "<div class='note'>Jika sempat muncul 502 saat perpindahan service, refresh beberapa detik kemudian.</div>"
                      )
                      self.send_bytes(page(body, 5))
                      return

                  opts = "".join(
                      f'<option value="{html.escape(v)}">{html.escape(label)}</option>'
                      for v, label in PRESETS
                  )
                  body = f"""
                  <h1>Local AI Launcher</h1>
                  <p>Runner sudah hidup. Pilih model yang mau didownload.</p>

                  <form method="post" action="/select">
                    <label>Password</label>
                    <input type="password" name="password" autocomplete="current-password" required>

                    <label>Model</label>
                    <select name="preset" id="preset" onchange="toggleCustom()">{opts}</select>

                    <div id="customBox" style="display:none">
                      <label id="customLabel">Custom model</label>
                      <input id="custom" name="custom" type="text"
                        placeholder="Ollama model atau direct HTTPS GGUF URL">
                    </div>

                    <label>Context length</label>
                    <select name="context">
                      <option value="4096">4096 — paling hemat RAM</option>
                      <option value="8192" selected>8192 — balanced</option>
                      <option value="16384">16384 — lebih berat</option>
                    </select>

                    <button type="submit">START AI</button>
                  </form>

                  <div class="note">
                    <b>Untuk test pertama:</b> Qwen 3 8B + context 8192.<br>
                    Untuk Qwen Abliterated GGUF pilih <b>Custom GGUF URL</b>.
                  </div>

                  <script>
                  function toggleCustom(){{
                    const p=document.getElementById("preset").value;
                    const custom=(p==="custom_ollama"||p==="custom_gguf");
                    document.getElementById("customBox").style.display=custom?"block":"none";
                    document.getElementById("custom").required=custom;
                    document.getElementById("customLabel").innerText=
                      p==="custom_gguf"?"Direct HTTPS GGUF URL":"Ollama model name";
                  }}
                  toggleCustom();
                  </script>
                  """
                  self.send_bytes(page(body))

              def do_POST(self):
                  if self.path != "/select":
                      self.send_error(404)
                      return
                  if already_selected():
                      self.send_bytes(page("<h1>Model sudah dipilih</h1><p>Setup sedang berjalan.</p>", 4))
                      return

                  try:
                      length = int(self.headers.get("Content-Length", "0"))
                  except ValueError:
                      self.send_error(400)
                      return

                  if length <= 0 or length > 8192:
                      self.send_error(413)
                      return

                  raw = self.rfile.read(length).decode("utf-8", "replace")
                  q = parse_qs(raw, keep_blank_values=True)

                  supplied = q.get("password", [""])[0]
                  if not hmac.compare_digest(supplied, PASSWORD):
                      self.send_bytes(page(
                          "<h1>Password salah</h1><p class='bad'>Gunakan nilai LOCAL_AI_PASSWORD.</p>"
                      ), 403)
                      return

                  preset = q.get("preset", [""])[0]
                  custom = q.get("custom", [""])[0].strip()
                  context = q.get("context", ["8192"])[0]
                  if context not in {"4096", "8192", "16384"}:
                      context = "8192"

                  preset_ids = {v for v, _ in PRESETS}

                  if preset == "custom_ollama":
                      if not MODEL_RE.fullmatch(custom):
                          self.send_bytes(page("<h1>Nama model tidak valid</h1>"), 400)
                          return
                      kind, model = "ollama", custom
                  elif preset == "custom_gguf":
                      if len(custom) > 2048 or not is_public_https_url(custom):
                          self.send_bytes(page(
                              "<h1>GGUF URL ditolak</h1>"
                              "<p>Harus HTTPS publik dan tidak boleh menunjuk IP/private network.</p>"
                          ), 400)
                          return
                      kind, model = "gguf", custom
                  else:
                      if preset not in preset_ids or preset.startswith("custom_"):
                          self.send_error(400)
                          return
                      kind, model = "ollama", preset

                  atomic_write({
                      "kind": kind,
                      "model": model,
                      "context": int(context),
                  })

                  with open(STATUS_FILE, "w", encoding="utf-8") as f:
                      f.write("Pilihan diterima. Workflow melanjutkan setup...")

                  self.send_bytes(page(
                      f"<h1>Pilihan diterima ✅</h1>"
                      f"<p><b>{html.escape(model)}</b></p>"
                      "<p>Workflow akan download model, mengetes inference, lalu menyalakan Open WebUI.</p>",
                      5
                  ))

          ThreadingHTTPServer(("127.0.0.1", 8080), H).serve_forever()
          PY

          chmod 600 "$BASE/launcher.py"
          python3 -m py_compile "$BASE/launcher.py"
          echo "Secure launcher: OK"

      - name: Install Cloudflare Tunnel client
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          curl --proto '=https' --tlsv1.2 -fL --retry 3 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o "$BASE/bin/cloudflared"

          chmod 700 "$BASE/bin/cloudflared"
          "$BASE/bin/cloudflared" --version

      - name: Start model selector
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          echo "Menunggu pilihan model..." > "$STATUS_FILE"

          nohup python3 "$BASE/launcher.py" \
            > "$BASE/logs/launcher.log" 2>&1 &
          echo $! > "$BASE/launcher.pid"

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "Launcher: OK"
              exit 0
            fi
            sleep 1
          done

          echo "::error::Launcher gagal start."
          cat "$BASE/logs/launcher.log" || true
          exit 1

      - name: Start one HTTPS URL
        id: tunnel
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          nohup "$BASE/bin/cloudflared" tunnel \
            --no-autoupdate \
            --url http://127.0.0.1:8080 \
            > "$BASE/logs/cloudflared.log" 2>&1 &
          echo $! > "$BASE/cloudflared.pid"

          URL=""
          for i in {1..60}; do
            URL="$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' "$BASE/logs/cloudflared.log" | head -n1 || true)"
            [ -n "$URL" ] && break
            sleep 1
          done

          if [ -z "$URL" ]; then
            echo "::error::Cloudflare tunnel gagal."
            cat "$BASE/logs/cloudflared.log" || true
            exit 1
          fi

          echo "url=$URL" >> "$GITHUB_OUTPUT"

          {
            echo "## 🚀 Local AI"
            echo
            echo "Buka dari HP: **$URL**"
            echo
            echo "URL ini tetap sama dari selector sampai Open WebUI selama run ini aktif."
            echo
            echo "Password selector/Open WebUI = repository secret \`LOCAL_AI_PASSWORD\`."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "========================================================"
          echo " BUKA DARI HP:"
          echo " $URL"
          echo "========================================================"

      - name: Wait for model selection
        id: selection
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          echo "Menunggu pilihan dari HP..."

          for i in {1..1800}; do
            if [ -s "$SELECT_FILE" ]; then
              break
            fi

            kill -0 "$(cat "$BASE/launcher.pid")" 2>/dev/null || {
              echo "::error::Launcher berhenti."
              exit 1
            }

            kill -0 "$(cat "$BASE/cloudflared.pid")" 2>/dev/null || {
              echo "::error::Tunnel berhenti."
              exit 1
            }

            sleep 2
          done

          [ -s "$SELECT_FILE" ] || {
            echo "::error::Timeout 60 menit menunggu pilihan model."
            exit 1
          }

          python3 - <<'PY'
          import os, json
          with open(os.environ["SELECT_FILE"], encoding="utf-8") as f:
              c = json.load(f)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("kind=" + c["kind"] + "\n")
              f.write("model=" + c["model"] + "\n")
              f.write("context=" + str(c["context"]) + "\n")

          print("Selection accepted")
          print("kind:", c["kind"])
          print("context:", c["context"])
          # URL custom sengaja tidak dicetak penuh ke log.
          if c["kind"] == "ollama":
              print("model:", c["model"])
          else:
              print("model: custom GGUF")
          PY

      - name: Install and tune Ollama
        shell: bash
        env:
          SELECTED_CONTEXT: ${{ steps.selection.outputs.context }}
        run: |
          set -euo pipefail
          umask 077

          echo "Installing Ollama..." > "$STATUS_FILE"
          curl --proto '=https' --tlsv1.2 -fsSL https://ollama.com/install.sh | sh

          sudo systemctl stop ollama 2>/dev/null || true
          pkill -f "ollama serve" 2>/dev/null || true
          sleep 2

          echo "Starting Ollama (CPU optimized)..." > "$STATUS_FILE"

          nohup env \
            OLLAMA_HOST=127.0.0.1:11434 \
            OLLAMA_MODELS="$OLLAMA_MODELS" \
            OLLAMA_CONTEXT_LENGTH="$SELECTED_CONTEXT" \
            OLLAMA_NUM_PARALLEL=1 \
            OLLAMA_MAX_LOADED_MODELS=1 \
            OLLAMA_KEEP_ALIVE=15m \
            ollama serve \
            > "$BASE/logs/ollama.log" 2>&1 &

          echo $! > "$BASE/ollama.pid"

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
              echo "Ollama: OK"
              ollama --version
              exit 0
            fi
            sleep 1
          done

          echo "::error::Ollama gagal start."
          cat "$BASE/logs/ollama.log" || true
          exit 1

      - name: Download selected model
        id: model
        shell: bash
        env:
          MODEL_KIND: ${{ steps.selection.outputs.kind }}
          MODEL_VALUE: ${{ steps.selection.outputs.model }}
          SELECTED_CONTEXT: ${{ steps.selection.outputs.context }}
        run: |
          set -euo pipefail
          umask 077

          if [ "$MODEL_KIND" = "ollama" ]; then
            echo "Downloading selected Ollama model..." > "$STATUS_FILE"
            ollama pull "$MODEL_VALUE"
            FINAL_MODEL="$MODEL_VALUE"
          elif [ "$MODEL_KIND" = "gguf" ]; then
            echo "Downloading custom GGUF..." > "$STATUS_FILE"

            GGUF="$BASE/custom/model.gguf"
            curl --proto '=https' --tlsv1.2 \
              -fL --retry 3 --retry-delay 3 \
              "$MODEL_VALUE" -o "$GGUF"

            cat > "$BASE/custom/Modelfile" <<EOF
          FROM $GGUF
          PARAMETER num_ctx $SELECTED_CONTEXT
          EOF

            echo "Importing custom GGUF..." > "$STATUS_FILE"
            ollama create custom-gguf -f "$BASE/custom/Modelfile"
            FINAL_MODEL="custom-gguf"
          else
            echo "::error::Unknown model kind."
            exit 1
          fi

          chmod -R go-rwx "$BASE/models" "$BASE/custom" || true
          echo "name=$FINAL_MODEL" >> "$GITHUB_OUTPUT"
          echo "Model downloaded. Running inference test..." > "$STATUS_FILE"

          ollama list

      - name: Preflight real inference test
        shell: bash
        env:
          FINAL_MODEL: ${{ steps.model.outputs.name }}
        run: |
          set -euo pipefail
          umask 077

          echo "Testing model before Open WebUI..." > "$STATUS_FILE"

          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request
          import sys

          model = os.environ["FINAL_MODEL"]
          payload = {
              "model": model,
              "prompt": "Reply with exactly one word: OK",
              "stream": False,
              "keep_alive": "15m",
              "options": {
                  "num_predict": 16,
                  "temperature": 0
              }
          }

          req = urllib.request.Request(
              "http://127.0.0.1:11434/api/generate",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          started = time.monotonic()
          try:
              with urllib.request.urlopen(req, timeout=240) as r:
                  data = json.loads(r.read().decode("utf-8"))
          except Exception as e:
              print("PRE-FLIGHT FAILED:", repr(e))
              sys.exit(1)

          wall = time.monotonic() - started
          response = (data.get("response") or "").strip()
          eval_count = int(data.get("eval_count") or 0)
          eval_ns = int(data.get("eval_duration") or 0)
          load_ns = int(data.get("load_duration") or 0)

          if not response:
              print("PRE-FLIGHT FAILED: empty response")
              sys.exit(1)

          tps = (eval_count / (eval_ns / 1e9)) if eval_count and eval_ns else 0.0

          print("===== MODEL PRE-FLIGHT =====")
          print("Response:", response[:200])
          print(f"Wall time: {wall:.2f}s")
          print(f"Load time: {load_ns/1e9:.2f}s")
          print(f"Generated tokens: {eval_count}")
          print(f"Generation speed: {tps:.2f} tok/s")
          print("PRE-FLIGHT: PASS")

          out = os.environ.get("GITHUB_STEP_SUMMARY")
          if out:
              with open(out, "a", encoding="utf-8") as f:
                  f.write("\n## 🧪 Model pre-flight\n\n")
                  f.write(f"- Model: `{model}`\n")
                  f.write(f"- Test response: `{response[:80]}`\n")
                  f.write(f"- Wall time: **{wall:.2f}s**\n")
                  f.write(f"- Generation speed: **{tps:.2f} tok/s**\n")
          PY

          echo
          echo "===== OLLAMA PS ====="
          ollama ps || true
          echo
          echo "===== RAM AFTER LOAD ====="
          free -h

          echo "Model test passed. Starting Open WebUI..." > "$STATUS_FILE"

      - name: Pull Open WebUI
        shell: bash
        run: |
          set -euo pipefail
          echo "Downloading Open WebUI..." > "$STATUS_FILE"
          docker pull ghcr.io/open-webui/open-webui:main

      - name: Switch same URL to Open WebUI
        shell: bash
        env:
          TUNNEL_URL: ${{ steps.tunnel.outputs.url }}
          FINAL_MODEL: ${{ steps.model.outputs.name }}
        run: |
          set -euo pipefail
          umask 077

          echo "Starting Open WebUI..." > "$STATUS_FILE"

          # Hentikan selector tetapi JANGAN hentikan Cloudflare.
          # Karena tunnel tetap menunjuk localhost:8080, URL tidak berubah.
          kill "$(cat "$BASE/launcher.pid")" 2>/dev/null || true

          for i in {1..20}; do
            if ! curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          WEBUI_SECRET_KEY="$(openssl rand -hex 32)"

          docker rm -f open-webui 2>/dev/null || true

          docker run -d \
            --name open-webui \
            --network host \
            --read-only=false \
            -e OLLAMA_BASE_URL=http://127.0.0.1:11434 \
            -e WEBUI_URL="$TUNNEL_URL" \
            -e WEBUI_SECRET_KEY="$WEBUI_SECRET_KEY" \
            -e WEBUI_AUTH=True \
            -e WEBUI_ADMIN_EMAIL=admin@local.ai \
            -e WEBUI_ADMIN_PASSWORD="$LOCAL_AI_PASSWORD" \
            -e WEBUI_ADMIN_NAME="Local AI Admin" \
            -e ENABLE_SIGNUP=False \
            -e DEFAULT_USER_ROLE=pending \
            -e ENABLE_PLUGINS=False \
            -e ENABLE_PIP_INSTALL_FRONTMATTER_REQUIREMENTS=False \
            -e USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS=False \
            -e USER_PERMISSIONS_WORKSPACE_TOOLS_IMPORT=False \
            -e USER_PERMISSIONS_WORKSPACE_SKILLS_ACCESS=False \
            -e ENABLE_WEB_SEARCH=False \
            -e DEFAULT_MODEL_PARAMS='{"function_calling":"native"}' \
            -e DEFAULT_MODEL_METADATA='{"capabilities":{"builtin_tools":false,"file_upload":true,"file_context":true,"web_search":false,"code_interpreter":false}}' \
            -v "$BASE/openwebui-data:/app/backend/data" \
            ghcr.io/open-webui/open-webui:main

          READY=0
          for i in {1..180}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" != "1" ]; then
            echo "::error::Open WebUI gagal start."
            docker logs --tail 250 open-webui || true
            exit 1
          fi

          {
            echo
            echo "## ✅ Open WebUI ready"
            echo
            echo "URL yang sama: **$TUNNEL_URL**"
            echo
            echo "Email: \`admin@local.ai\`"
            echo
            echo "Password: secret \`LOCAL_AI_PASSWORD\`"
            echo
            echo "Model: \`$FINAL_MODEL\`"
            echo
            echo
            echo "Builtin Tools sementara OFF agar model kecil/coder tidak lagi mengeluarkan tool-call acak seperti create_calendar_event."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "========================================================"
          echo " OPEN WEBUI READY"
          echo " $TUNNEL_URL"
          echo " Email: admin@local.ai"
          echo " Password: LOCAL_AI_PASSWORD (secret, tidak dicetak)"
          echo "========================================================"

      - name: Keep runner alive and health-check
        shell: bash
        run: |
          set -euo pipefail

          echo "AI aktif. Stop workflow kalau sudah selesai."

          while true; do
            if ! docker ps --format '{{.Names}}' | grep -qx 'open-webui'; then
              echo "::error::Open WebUI container berhenti."
              docker logs --tail 250 open-webui || true
              exit 1
            fi

            if ! kill -0 "$(cat "$BASE/cloudflared.pid")" 2>/dev/null; then
              echo "::error::Cloudflare tunnel berhenti."
              cat "$BASE/logs/cloudflared.log" || true
              exit 1
            fi

            if ! curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
              echo "::error::Ollama tidak merespons."
              cat "$BASE/logs/ollama.log" || true
              exit 1
            fi

            sleep 60
          done
