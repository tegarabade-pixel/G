name: Local AI Runner v1.4

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model yang dipasang langsung di runner"
        required: true
        type: choice
        default: qwen3:8b
        options:
          - qwen3:8b
          - qwen3:14b
          - qwen2.5:14b
          - qwen2.5-coder:7b
          - qwen2.5-coder:14b
          - custom-ollama
          - custom-gguf

      custom_model:
        description: "Isi hanya jika Custom: nama Ollama atau direct HTTPS .gguf URL"
        required: false
        type: string
        default: ""

      context:
        description: "Context length"
        required: true
        type: choice
        default: "8192"
        options:
          - "4096"
          - "8192"
          - "16384"

      tunnel:
        description: "WebUI tunnel (model TIDAK lewat selector/tunnel)"
        required: true
        type: choice
        default: ngrok-stable
        options:
          - ngrok-stable
          - cloudflare-named

permissions: {}

concurrency:
  group: local-ai-${{ github.repository }}
  cancel-in-progress: true

jobs:
  local-ai:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      BASE: /home/runner/localai
      OLLAMA_MODELS: /home/runner/localai/models
      LOCAL_AI_PASSWORD: ${{ secrets.LOCAL_AI_PASSWORD }}
      NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
      CF_PUBLIC_URL: ${{ vars.CF_PUBLIC_URL }}

    steps:
      - name: Authorize owner and prepare runner
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          if [ "$GITHUB_ACTOR" != "$GITHUB_REPOSITORY_OWNER" ]; then
            echo "::error::Hanya repository owner yang boleh menjalankan workflow ini."
            exit 1
          fi

          if [ -z "${LOCAL_AI_PASSWORD:-}" ]; then
            echo "::error::Secret LOCAL_AI_PASSWORD belum dibuat."
            exit 1
          fi

          echo "::add-mask::$LOCAL_AI_PASSWORD"
          [ -n "${NGROK_AUTHTOKEN:-}" ] && echo "::add-mask::$NGROK_AUTHTOKEN"
          [ -n "${CF_TUNNEL_TOKEN:-}" ] && echo "::add-mask::$CF_TUNNEL_TOKEN"

          mkdir -p \
            "$BASE/models" \
            "$BASE/openwebui-data" \
            "$BASE/custom" \
            "$BASE/workspace" \
            "$BASE/logs" \
            "$BASE/bin"
          chmod -R go-rwx "$BASE"

          echo "===== RUNNER ====="
          echo "Model input : ${{ inputs.model }}"
          echo "Context     : ${{ inputs.context }}"
          echo "Tunnel      : ${{ inputs.tunnel }}"
          echo
          nproc
          free -h
          df -h /

      - name: Resolve and validate model
        id: selected
        shell: bash
        env:
          INPUT_MODEL: ${{ inputs.model }}
          CUSTOM_MODEL: ${{ inputs.custom_model }}
        run: |
          set -euo pipefail
          umask 077

          python3 - <<'PY'
          import os, re, sys, socket, ipaddress
          from urllib.parse import urlparse

          preset = os.environ["INPUT_MODEL"].strip()
          custom = os.environ.get("CUSTOM_MODEL", "").strip()

          allowed = {
              "qwen3:8b",
              "qwen3:14b",
              "qwen2.5:14b",
              "qwen2.5-coder:7b",
              "qwen2.5-coder:14b",
          }

          model_re = re.compile(
              r"^[A-Za-z0-9][A-Za-z0-9._/-]{0,180}(?::[A-Za-z0-9._-]{1,80})?$"
          )

          def public_https(url):
              try:
                  u = urlparse(url)
                  if u.scheme != "https" or not u.hostname or u.username or u.password:
                      return False
                  host = u.hostname.lower().rstrip(".")
                  if host == "localhost" or host.endswith(".local"):
                      return False
                  infos = socket.getaddrinfo(host, u.port or 443, type=socket.SOCK_STREAM)
                  if not infos:
                      return False
                  for info in infos:
                      ip = ipaddress.ip_address(info[4][0])
                      if (ip.is_private or ip.is_loopback or ip.is_link_local or
                          ip.is_multicast or ip.is_reserved or ip.is_unspecified):
                          return False
                  return True
              except Exception:
                  return False

          if preset in allowed:
              kind, value = "ollama", preset
          elif preset == "custom-ollama":
              if not custom or not model_re.fullmatch(custom):
                  print("Invalid custom Ollama model", file=sys.stderr)
                  sys.exit(1)
              kind, value = "ollama", custom
          elif preset == "custom-gguf":
              if not custom or len(custom) > 2048 or not public_https(custom):
                  print("Custom GGUF harus berupa direct HTTPS URL publik.", file=sys.stderr)
                  sys.exit(1)
              kind, value = "gguf", custom
          else:
              print("Unknown model preset", file=sys.stderr)
              sys.exit(1)

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
              f.write(f"kind={kind}\n")
              if kind == "ollama":
                  f.write(f"value={value}\n")
                  print("Resolved model:", value)
              else:
                  # URL GGUF tidak ditampilkan ke log.
                  f.write("value<<EOF\n")
                  f.write(value + "\n")
                  f.write("EOF\n")
                  print("Resolved model: custom GGUF")
          PY

      - name: Install Ollama
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true
          pkill -f "ollama serve" 2>/dev/null || true
          sleep 2
          ollama --version

      - name: Start Ollama on runner only
        id: ollama
        shell: bash
        env:
          SELECTED_CONTEXT: ${{ inputs.context }}
        run: |
          set -euo pipefail
          export OLLAMA_HOST=127.0.0.1:11434
          export OLLAMA_MODELS="$OLLAMA_MODELS"
          export OLLAMA_CONTEXT_LENGTH="$SELECTED_CONTEXT"
          export OLLAMA_NUM_PARALLEL=1
          export OLLAMA_MAX_LOADED_MODELS=1
          export OLLAMA_KEEP_ALIVE=15m
          exec ollama serve
        background: true

      - name: Wait for local Ollama
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..75}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
              echo "Ollama local API: OK"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Ollama tidak merespons."
          exit 1

      - name: Install selected model directly on runner
        id: model
        shell: bash
        env:
          MODEL_KIND: ${{ steps.selected.outputs.kind }}
          MODEL_VALUE: ${{ steps.selected.outputs.value }}
          SELECTED_CONTEXT: ${{ inputs.context }}
        run: |
          set -euo pipefail
          umask 077

          if [ "$MODEL_KIND" = "ollama" ]; then
            ollama pull "$MODEL_VALUE"
            FINAL_MODEL="$MODEL_VALUE"
          else
            GGUF="$BASE/custom/model.gguf"
            curl --proto '=https' --tlsv1.2 \
              -fL --retry 3 --retry-delay 3 \
              "$MODEL_VALUE" -o "$GGUF"

            cat > "$BASE/custom/Modelfile" <<EOF
          FROM $GGUF
          PARAMETER num_ctx $SELECTED_CONTEXT
          EOF

            ollama create custom-gguf -f "$BASE/custom/Modelfile"
            FINAL_MODEL="custom-gguf"
          fi

          echo "name=$FINAL_MODEL" >> "$GITHUB_OUTPUT"
          echo
          ollama list
          echo
          free -h

      - name: Preflight inference without Qwen3 thinking
        shell: bash
        env:
          FINAL_MODEL: ${{ steps.model.outputs.name }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json, os, time, urllib.request, sys

          model = os.environ["FINAL_MODEL"]
          payload = {
              "model": model,
              "prompt": "Reply with exactly: OK",
              "stream": False,
              "think": False,
              "keep_alive": "15m",
              "options": {
                  "num_predict": 32,
                  "temperature": 0
              }
          }

          req = urllib.request.Request(
              "http://127.0.0.1:11434/api/generate",
              data=json.dumps(payload).encode(),
              headers={"Content-Type":"application/json"},
              method="POST"
          )

          t0 = time.monotonic()
          try:
              with urllib.request.urlopen(req, timeout=300) as r:
                  data = json.loads(r.read().decode())
          except Exception as e:
              print("PRE-FLIGHT ERROR:", repr(e))
              sys.exit(1)

          wall = time.monotonic() - t0
          response = (data.get("response") or "").strip()
          thinking = (data.get("thinking") or "").strip()

          if not response:
              print("PRE-FLIGHT FAILED: final response kosong")
              if thinking:
                  print("Model menghasilkan thinking tetapi tidak final response.")
              print(json.dumps({
                  "done": data.get("done"),
                  "done_reason": data.get("done_reason"),
                  "eval_count": data.get("eval_count"),
                  "prompt_eval_count": data.get("prompt_eval_count"),
              }, indent=2))
              sys.exit(1)

          eval_count = int(data.get("eval_count") or 0)
          eval_ns = int(data.get("eval_duration") or 0)
          speed = eval_count / (eval_ns / 1e9) if eval_count and eval_ns else 0

          print("===== PRE-FLIGHT PASS =====")
          print("Response:", response[:200])
          print(f"Wall time: {wall:.2f}s")
          print(f"Speed: {speed:.2f} tok/s")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## 🧪 Model test\n\n")
              f.write(f"- Model: `{model}`\n")
              f.write(f"- Response: `{response[:80]}`\n")
              f.write(f"- Wall time: **{wall:.2f}s**\n")
              f.write(f"- Speed: **{speed:.2f} tok/s**\n")
          PY

          echo
          ollama ps || true
          free -h

      - name: Pull Open WebUI
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/open-webui/open-webui:main

      - name: Start Open WebUI locally
        shell: bash
        env:
          FINAL_MODEL: ${{ steps.model.outputs.name }}
        run: |
          set -euo pipefail
          WEBUI_SECRET_KEY="$(openssl rand -hex 32)"

          docker rm -f open-webui 2>/dev/null || true

          docker run -d \
            --name open-webui \
            --network host \
            -e OLLAMA_BASE_URL=http://127.0.0.1:11434 \
            -e WEBUI_SECRET_KEY="$WEBUI_SECRET_KEY" \
            -e WEBUI_AUTH=True \
            -e WEBUI_ADMIN_EMAIL=admin@local.ai \
            -e WEBUI_ADMIN_PASSWORD="$LOCAL_AI_PASSWORD" \
            -e WEBUI_ADMIN_NAME="Local AI Admin" \
            -e ENABLE_SIGNUP=False \
            -e ENABLE_WEB_SEARCH=False \
            -e ENABLE_PLUGINS=False \
            -v "$BASE/openwebui-data:/app/backend/data" \
            ghcr.io/open-webui/open-webui:main

          for i in {1..180}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then
              echo "Open WebUI localhost:8080 READY"
              exit 0
            fi
            sleep 2
          done

          docker logs --tail 250 open-webui || true
          exit 1

      - name: Install tunnel client
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ inputs.tunnel }}" = "ngrok-stable" ]; then
            if [ -z "${NGROK_AUTHTOKEN:-}" ]; then
              echo "::error::Secret NGROK_AUTHTOKEN belum dibuat."
              exit 1
            fi
            python3 -m pip install --user --disable-pip-version-check "ngrok==1.7.0"
          else
            if [ -z "${CF_TUNNEL_TOKEN:-}" ]; then
              echo "::error::Secret CF_TUNNEL_TOKEN belum dibuat."
              exit 1
            fi
            if [ -z "${CF_PUBLIC_URL:-}" ]; then
              echo "::error::Repository Variable CF_PUBLIC_URL belum dibuat (contoh https://ai.domainmu.com)."
              exit 1
            fi

            curl --proto '=https' --tlsv1.2 -fL --retry 3 \
              https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
              -o "$BASE/bin/cloudflared"
            chmod 700 "$BASE/bin/cloudflared"
            "$BASE/bin/cloudflared" --version
          fi

      - name: Start ngrok for WebUI only
        id: ngrok
        if: ${{ inputs.tunnel == 'ngrok-stable' }}
        shell: bash
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          set -euo pipefail
          exec python3 - <<'PY'
          import ngrok, time, os
          url_file = os.path.join(os.environ["BASE"], "public-url.txt")
          listener = ngrok.forward(8080, authtoken_from_env=True)
          with open(url_file, "w", encoding="utf-8") as f:
              f.write(listener.url())
          print("ngrok WebUI tunnel ready", flush=True)
          while True:
              time.sleep(3600)
          PY
        background: true

      - name: Start Cloudflare named tunnel for WebUI only
        id: cloudflare
        if: ${{ inputs.tunnel == 'cloudflare-named' }}
        shell: bash
        run: |
          set -euo pipefail
          exec "$BASE/bin/cloudflared" tunnel \
            --no-autoupdate \
            run \
            --token "$CF_TUNNEL_TOKEN"
        background: true

      - name: Publish WebUI URL
        id: public
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ inputs.tunnel }}" = "ngrok-stable" ]; then
            URL=""
            for i in {1..90}; do
              [ -s "$BASE/public-url.txt" ] && URL="$(cat "$BASE/public-url.txt")"
              [ -n "$URL" ] && break
              sleep 1
            done
            [ -n "$URL" ] || { echo "::error::ngrok URL tidak ditemukan."; exit 1; }

            READY=0
            for i in {1..90}; do
              if curl -fsS --max-time 10 \
                -H 'ngrok-skip-browser-warning: 1' \
                "$URL/" >/dev/null 2>&1; then
                READY=1
                break
              fi
              sleep 2
            done
          else
            URL="$CF_PUBLIC_URL"
            READY=0
            for i in {1..90}; do
              if curl -fsS --max-time 10 "$URL/" >/dev/null 2>&1; then
                READY=1
                break
              fi
              sleep 2
            done
          fi

          [ "$READY" = "1" ] || {
            echo "::error::Public WebUI URL belum dapat dijangkau."
            exit 1
          }

          echo "url=$URL" >> "$GITHUB_OUTPUT"

          {
            echo
            echo "## ✅ Local AI ready"
            echo
            echo "WebUI: **$URL**"
            echo
            echo "Email: \`admin@local.ai\`"
            echo
            echo "Password: secret \`LOCAL_AI_PASSWORD\`"
            echo
            echo "Model dipasang langsung di runner: \`${{ steps.model.outputs.name }}\`"
            echo
            echo "Ollama tetap private di \`127.0.0.1:11434\`; hanya Open WebUI port 8080 yang ditunnel."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "========================================================"
          echo " LOCAL AI READY"
          echo " $URL"
          echo "========================================================"

      - name: Keep runner alive
        shell: bash
        env:
          PUBLIC_URL: ${{ steps.public.outputs.url }}
        run: |
          set -euo pipefail
          echo "AI aktif. Stop workflow kalau sudah selesai."

          while true; do
            docker ps --format '{{.Names}}' | grep -qx open-webui || {
              echo "::error::Open WebUI berhenti."
              docker logs --tail 250 open-webui || true
              exit 1
            }

            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 || {
              echo "::error::Ollama local berhenti."
              exit 1
            }

            sleep 60
          done

      - wait-all:
      
