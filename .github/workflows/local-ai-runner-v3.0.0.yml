# Self-contained: upload this file to .github/workflows/local-ai-v3.yml
# Embedded source is reproducible with scripts/make_release.py in the source ZIP.
name: Local AI Runner v3 · tools and agents
'on':
  workflow_dispatch:
    inputs:
      layout:
        description: single disarankan; cluster membutuhkan 4 job serentak + Tailscale
        type: choice
        default: single
        options:
        - single
        - cluster
      model:
        description: Model utama; mulai dari 4b
        type: choice
        default: qwen3.5:4b
        options:
        - qwen3.5:2b
        - qwen3.5:4b
        - qwen3.5:9b
      deep_model:
        description: Spesialis riset/review (cluster saja)
        type: choice
        default: qwen3.5:9b
        options:
        - qwen3.5:4b
        - qwen3.5:9b
      coder_model:
        description: Spesialis coding/data (cluster saja)
        type: choice
        default: qwen2.5-coder:7b
        options:
        - qwen3.5:4b
        - qwen2.5-coder:7b
        - qwen3.5:9b
      context:
        description: Context lebih besar memakai lebih banyak memori dan waktu
        type: choice
        default: '8192'
        options:
        - '4096'
        - '8192'
        - '16384'
      minutes:
        description: Durasi sesi pengembangan setelah siap
        type: choice
        default: '120'
        options:
        - '60'
        - '120'
        - '240'
      tunnel:
        description: Akses UI dari ponsel
        type: choice
        default: ngrok
        options:
        - ngrok
        - cloudflare
permissions:
  contents: read
concurrency:
  group: local-ai-v3-${{ github.repository }}
  cancel-in-progress: false
env:
  AI_SOURCE_B64: 
  LOCAL_AI_PASSWORD: ${{ secrets.LOCAL_AI_PASSWORD }}
  AI_MODEL: ${{ inputs.model }}
  AI_CONTEXT: ${{ inputs.context }}
  SESSION_MINUTES: ${{ inputs.minutes }}
  AI_LAYOUT: ${{ inputs.layout }}
  AI_TUNNEL: ${{ inputs.tunnel }}
  AI_SANDBOX: docker
  LANGCHAIN_TRACING_V2: 'false'
  LANGSMITH_TRACING: 'false'
jobs:
  workers:
    if: ${{ inputs.layout == 'cluster' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: true
      matrix:
        role:
        - main
        - deep
        - coder
    steps:
    - name: Extract bundled runner and install locked dependencies
      run: |
        set -euo pipefail
        python3 - <<'BOOT'
        import base64, gzip, hashlib, io, os, pathlib, tarfile
        password = os.environ.get('LOCAL_AI_PASSWORD', '')
        if len(password) < 12:
            raise SystemExit('Buat Secret LOCAL_AI_PASSWORD minimal 12 karakter.')
        root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'local-ai-v3'
        root.mkdir(exist_ok=True)
        with tarfile.open(fileobj=io.BytesIO(gzip.decompress(base64.b64decode(os.environ['AI_SOURCE_B64'])))) as archive:
            archive.extractall(root, filter='data')
        suffix = os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
        key = hashlib.pbkdf2_hmac('sha256', password.encode(), suffix.encode(), 100000).hex()
        print('::add-mask::' + key)
        with open(os.environ['GITHUB_ENV'], 'a') as f:
            for k, v in {'AI_HOME': str(root), 'AI_DATA_DIR': str(root / 'data'), 'PYTHONPATH': str(root),
                         'RUN_SUFFIX': suffix, 'CLUSTER_KEY': key}.items():
                f.write(k + '=' + v + '\n')
        BOOT
        python3 -m venv "$RUNNER_TEMP/localai-venv"
        "$RUNNER_TEMP/localai-venv/bin/python" -m pip install --disable-pip-version-check -r "$RUNNER_TEMP/local-ai-v3/requirements.lock"
        echo "$RUNNER_TEMP/localai-venv/bin" >> "$GITHUB_PATH"
    - name: Join private Tailscale network
      uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
      with:
        authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
        hostname: aiv3-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.role }}
        use-cache: 'false'
        log-mode: grouped
    - name: Select model and private bind address
      run: |
        set -euo pipefail
        case "$WORKER_ROLE" in
          main) selected="$MAIN_MODEL" ;;
          deep) selected="$DEEP_MODEL" ;;
          coder) selected="$CODER_MODEL" ;;
        esac
        echo "AI_MODEL=$selected" >> "$GITHUB_ENV"
        echo "TS_IP=$(tailscale ip -4 | head -1)" >> "$GITHUB_ENV"
      env:
        WORKER_ROLE: ${{ matrix.role }}
        MAIN_MODEL: ${{ inputs.model }}
        DEEP_MODEL: ${{ inputs.deep_model }}
        CODER_MODEL: ${{ inputs.coder_model }}
    - name: Install Ollama and download selected model
      working-directory: ${{ env.AI_HOME }}
      run: bash scripts/install-ollama.sh
    - name: Warm model with the selected context
      working-directory: ${{ env.AI_HOME }}
      run: |
        python - <<'PYW'
        import asyncio, os
        from scripts.session import warmup
        asyncio.run(warmup('http://127.0.0.1:11434', os.environ['AI_MODEL'], int(os.environ['AI_CONTEXT'])))
        PYW
    - name: Serve authenticated private inference
      working-directory: ${{ env.AI_HOME }}
      run: python -m ai_runner.worker
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      NGROK_DOMAIN: ${{ vars.NGROK_DOMAIN }}
      CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
      CF_PUBLIC_URL: ${{ vars.CF_PUBLIC_URL }}
    steps:
    - name: Extract bundled runner and install locked dependencies
      run: |
        set -euo pipefail
        python3 - <<'BOOT'
        import base64, gzip, hashlib, io, os, pathlib, tarfile
        password = os.environ.get('LOCAL_AI_PASSWORD', '')
        if len(password) < 12:
            raise SystemExit('Buat Secret LOCAL_AI_PASSWORD minimal 12 karakter.')
        root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'local-ai-v3'
        root.mkdir(exist_ok=True)
        with tarfile.open(fileobj=io.BytesIO(gzip.decompress(base64.b64decode(os.environ['AI_SOURCE_B64'])))) as archive:
            archive.extractall(root, filter='data')
        suffix = os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
        key = hashlib.pbkdf2_hmac('sha256', password.encode(), suffix.encode(), 100000).hex()
        print('::add-mask::' + key)
        with open(os.environ['GITHUB_ENV'], 'a') as f:
            for k, v in {'AI_HOME': str(root), 'AI_DATA_DIR': str(root / 'data'), 'PYTHONPATH': str(root),
                         'RUN_SUFFIX': suffix, 'CLUSTER_KEY': key}.items():
                f.write(k + '=' + v + '\n')
        BOOT
        python3 -m venv "$RUNNER_TEMP/localai-venv"
        "$RUNNER_TEMP/localai-venv/bin/python" -m pip install --disable-pip-version-check -r "$RUNNER_TEMP/local-ai-v3/requirements.lock"
        echo "$RUNNER_TEMP/localai-venv/bin" >> "$GITHUB_PATH"
    - name: Check tunnel secrets
      run: |
        set -euo pipefail
        if [ "$AI_TUNNEL" = ngrok ]; then
          test -n "$NGROK_AUTHTOKEN" || { echo 'Buat Secret NGROK_AUTHTOKEN.'; exit 1; }
        else
          test -n "$CF_TUNNEL_TOKEN" && test -n "$CF_PUBLIC_URL" || { echo 'Cloudflare memerlukan Secret CF_TUNNEL_TOKEN dan Variable CF_PUBLIC_URL.'; exit 1; }
        fi
        if [ "$AI_LAYOUT" = cluster ] && [ -z "$TAILSCALE_AUTHKEY" ]; then
          echo 'Cluster memerlukan Secret TAILSCALE_AUTHKEY yang reusable dan ephemeral.'; exit 1
        fi
      env:
        TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
    - name: Join private Tailscale network
      uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
      with:
        authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
        hostname: aiv3-${{ github.run_id }}-${{ github.run_attempt }}-ui
        use-cache: 'false'
        log-mode: grouped
      if: ${{ inputs.layout == 'cluster' }}
    - name: Run regression checks
      working-directory: ${{ env.AI_HOME }}
      run: |-
        python -m compileall -q ai_runner scripts
        python -m pytest -q
    - name: Build isolated tool container
      working-directory: ${{ env.AI_HOME }}
      run: |-
        docker build -t local-ai-tools:v3 -f Dockerfile.tools .
        python -m scripts.check_runtime
    - name: Install local Ollama and selected model
      if: ${{ inputs.layout == 'single' }}
      working-directory: ${{ env.AI_HOME }}
      run: bash scripts/install-ollama.sh
    - name: Install Cloudflare tunnel client
      if: ${{ inputs.tunnel == 'cloudflare' }}
      run: |
        set -euo pipefail
        curl -fL --retry 3 https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o "$RUNNER_TEMP/cloudflared"
        chmod 755 "$RUNNER_TEMP/cloudflared"
        sudo install "$RUNNER_TEMP/cloudflared" /usr/local/bin/cloudflared
    - name: Open development session (URL in Summary)
      working-directory: ${{ env.AI_HOME }}
      run: python -m scripts.session
    - name: Export encrypted backup
      if: ${{ always() }}
      run: |
        if [ -f "$AI_DATA_DIR/state/app.sqlite3" ]; then
          cd "$AI_HOME"
          python -m ai_runner.backup export "$RUNNER_TEMP/local-ai-backup.enc"
        fi
    - name: Save encrypted session backup
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: local-ai-v3-encrypted-backup-${{ github.run_id }}
        path: ${{ runner.temp }}/local-ai-backup.enc
        retention-days: 7
        if-no-files-found: ignore
